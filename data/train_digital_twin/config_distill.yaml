data-source:
  foundation-core:
    session: 4
    scan_idx: 7
    directory: /project/rf/data/microns_digital_twin/params
  training:
    directory: /project/rf/data/train_digital_twin/training_data_27203_4_7
    # max_items: 30

svd_dir: /project/rf/code/fnn/svd

pts:
  temperature: 0.01
  n: 3

distillation:
  burnin_frames: 10
  sample_stream: true
  pooled: true         # true → SVD+PTS on spatially-pooled [N,C], loss on [N,K]
  channel_norm: true  # true → divide each channel by its std before MSE

scheduler:
  cycle_size: 200
  warmup_epochs: 20
  warmup_cycles: 1

optimizer:
  lr: 0.4
  decay: 0.0001
  momentum: 0.9
  nesterov: true
  clip: 0.01
  eps: 0.001
  seed: 0
 
loader:
  num_workers: 4
  prefetch_factor: 2
  sample_size: 100
  batch_size: 8
  training_size: 125
  validation_size: 5

save-state:
  directory: /project/rf/data/train_digital_twin/results_distill_ex18
  state_dict: state_dict.pth
  best_state_dict: best_state_dict.pth
  init_state_dict: init_state_dict.pth
  metrics_csv: training_metrics.csv
  metrics_tensor: training_metrics.pt
