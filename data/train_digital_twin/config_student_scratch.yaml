data-source:
  training:
    directory: /project/rf/data/train_digital_twin/training_data_27203_4_7
    # max_items: 30
  evaluation:
    directory: /project/rf/data/train_digital_twin/evaluation_data_27203_4_7

scheduler:
  cycle_size: 100
  warmup_epochs: 10
  warmup_cycles: 1

optimizer:
  lr: 0.4
  decay: 0.0001
  momentum: 0.9
  nesterov: true
  clip: 0.01
  eps: 0.001
  seed: 0

loader:
  num_workers: 4
  prefetch_factor: 2
  sample_size: 100
  batch_size: 8
  training_size: 125
  validation_size: 5

objective:
  sample_stream: true
  burnin_frames: 10

save-state:
  directory: /project/rf/data/train_digital_twin/results_student_scratch_ex16
  state_dict: state_dict.pth
  best_state_dict: best_state_dict.pth
  init_state_dict: init_state_dict.pth
  metrics_csv: training_metrics.csv
  metrics_tensor: training_metrics.pt
