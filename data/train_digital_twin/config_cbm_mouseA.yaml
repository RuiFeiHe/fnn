data-source:
  foundation-core:
    session: 4
    scan_idx: 7
    directory: /project/rf/data/microns_digital_twin/params

  training:
    directory: /project/rf/data/sensorium2023_fnn/mouseA/training
    # max_items: 50   # uncomment to limit trials for a quick smoke test

  evaluation:
    directory: /project/rf/data/sensorium2023_fnn/mouseA/evaluation

  # Pre-extracted VLM concept vectors (K x D_vlm float32).
  # Produced by: python scripts/extract_concept_vectors.py
  concept_vectors: /project/rf/code/fnn/data/concepts/concepts_visual_v2.npy

  # Pre-trained position embedding checkpoint.
  # Produced by: python scripts/learn_position_embedding.py config_position_embedding_mouseA.yaml
  position_embedding: /project/rf/data/sensorium2023_fnn/mouseA/position/ex16/position_embedding.pt

  # PositionFeature checkpoint used to seed the cross-attn spatial bias.
  # Its readout.position.mu [U, 2] provides per-neuron RF centres in [-1, 1] space.
  # Remove or comment out to start with uniform (zero) attention bias.
  spatial_bias_ckpt: /project/rf/data/sensorium2023/results/ex1_20260518_200840/state_dict.pth


model:
  # Core from foundation model — freeze for fast training; set false to fine-tune.
  freeze_core: true

  # CBM readout hyperparameters
  n_heads: 8          # cross-attention heads (must divide pos_embed_dim=1280)
  attn_drop: 0.0      # dropout inside cross-attention
  score_temp: 0.5     # temperature for concept-score cosine similarity

  # Keep frozen unless you want to fine-tune these pre-trained components.
  freeze_concepts: true  # concept vectors (VLM text embeddings)
  freeze_pos: true       # position embedding parameters

  # Per-neuron output weights: each neuron gets its own [K, R] readout weight
  # instead of a shared [K, R] weight across all neurons.
  per_neuron_out: true


scheduler:
  cycle_size: 100
  warmup_epochs: 10
  warmup_cycles: 1
    # cycle_size: 33
    # warmup_epochs: 5
    # warmup_cycles: 1   # only cycle 0 gets linear warmup; cycles 1, 2 restart from full LR
    # n_cycles: 3        # total = 99 epochs, 3 restarts


optimizer:
  lr: 0.2
  decay: 0.0001
  momentum: 0.9
  nesterov: true
  clip: 0.01
  eps: 0.001
  seed: 0
  readout_decay: 0.0001      # stronger regularisation on the CBM readout
  attn_bias_lr_scale: 0.01   # slow down attn_bias to preserve the RF prior early
  # core_lr_scale: 0.001     # uncomment when freeze_core: false to reduce core LR


loader:
  num_workers: 4
  prefetch_factor: 2
  sample_size: 100
  batch_size: 4
  training_size: 120
  validation_size: 5


objective:
  sample_stream: true
  burnin_frames: 10
  units_scale: 1.0   # sensorium responses are already normalised (mean ≈ 1)


save-state:
  directory: /project/rf/data/sensorium2023_fnn/mouseA/cbm_results/ex16.t1
  state_dict: state_dict.pth
  best_state_dict: best_state_dict.pth
  init_state_dict: init_state_dict.pth
  metrics_csv: training_metrics.csv
  metrics_tensor: training_metrics.pt
